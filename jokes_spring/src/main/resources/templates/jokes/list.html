<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${titulo}">Listado de Jokes</title>
</head>
<body>
<h1 th:text="${titulo}">Listado de Jokes</h1>

<p><a th:href="@{/jokes/new}">Crear nuevo Joke</a></p>

<table border="1" cellpadding="5">
    <thead>
    <tr>
        <th>ID</th>
        <th>Text1</th>
        <th>Text2</th>
        <th>Categoría</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="joke : ${jokes}">
        <td th:text="${joke.id}">1</td>
        <td th:text="${joke.text1}">…</td>
        <td th:text="${joke.text2}">…</td>
        <td th:text="${joke.category != null ? joke.category.name : ''}">–</td>
        <td>
            <a th:href="@{/jokes/{id}/edit(id=${joke.id})}">Editar</a>
            |
            <form th:action="@{/jokes/{id}/delete(id=${joke.id})}"
                  method="post"
                  style="display:inline">
                <button type="submit"
                        onclick="return confirm('¿Borrar este joke?');">
                    Borrar
                </button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
