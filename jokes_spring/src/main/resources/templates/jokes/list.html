<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout}">
<head>
    <title>Listado de Jokes</title>
</head>
<body>
<div>
    <h1>Jokes</h1>
    <a th:href="@{/jokes/new}">Crear nuevo Joke</a>
    <table>
        <thead>
        <tr>
            <th>ID</th><th>Text1</th><th>Categoría</th><th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="joke : ${jokes}">
            <td th:text="${joke.id}">1</td>
            <td th:text="${joke.text1}">Chiste…</td>
            <td th:text="${joke.category.name}">Categoría</td>
            <td>
                <a th:href="@{'/jokes/' + ${joke.id} + '/edit'}">Editar</a>
                <form th:action="@{'/jokes/' + ${joke.id} + '/delete'}"
                      method="post" style="display:inline">
                    <button type="submit">Borrar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
