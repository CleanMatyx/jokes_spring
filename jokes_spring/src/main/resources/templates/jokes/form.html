<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${isEditMode} ? 'Editar Joke' : 'Nuevo Joke'">Joke Form</title>
</head>
<body>
<h1 th:text="${isEditMode} ? 'Editar Joke' : 'Nuevo Joke'">Joke Form</h1>

<form th:action="@{${formAction}}" th:object="${jokeDto}" method="post">
    <!-- En update, Spring espera PUT -->
    <input type="hidden" name="_method" value="put" th:if="${isEditMode}"/>

    <!-- Texto 1 -->
    <div>
        <label for="text1">Texto 1</label>
        <input type="text" id="text1" th:field="*{text1}" />
    </div>

    <!-- Texto 2 -->
    <div>
        <label for="text2">Texto 2</label>
        <input type="text" id="text2" th:field="*{text2}" />
    </div>

    <!-- Categoría -->
    <div>
        <label for="category">Categoría</label>
        <select id="category" th:field="*{category}">
            <option value="" disabled th:if="${jokeDto.category} == null">-- selecciona una --</option>
            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">
            </option>
        </select>
    </div>

    <!-- Tipo -->
    <div>
        <label for="type">Tipo</label>
        <select id="type" th:field="*{type}">
            <option value="" disabled th:if="${jokeDto.type} == null">-- selecciona uno --</option>
            <option th:each="t : ${types}" th:value="${t.id}" th:text="${t.name}">
            </option>
        </select>
    </div>

    <!-- Lenguaje -->
    <div>
        <label for="language">Lenguaje</label>
        <select id="language" th:field="*{language}">
            <option value="" disabled th:if="${jokeDto.language} == null">-- selecciona uno --</option>
            <option th:each="l : ${languages}" th:value="${l.id}" th:text="${l.name}">
            </option>
        </select>
    </div>

    <!-- Flags (checkbox múltiple) -->
    <div>
        <p>Flags:</p>
        <div th:each="flag : ${flags}">
            <label>
                <input type="checkbox" th:field="*{flags}" th:value="${flag.id}" />
                <span th:text="${flag.name}">Flag</span>
            </label>
        </div>
    </div>

    <!-- Submit -->
    <div>
        <button type="submit" th:text="${isEditMode} ? 'Actualizar' : 'Crear'">
            Guardar
        </button>
    </div>
</form>
</body>
</html>
