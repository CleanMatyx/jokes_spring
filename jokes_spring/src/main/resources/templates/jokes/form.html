<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(
                      (jokeDto.id!=null ? 'Editar Joke' : 'Crear Joke'),
                      ~{::content}
                   )}">
<section th:fragment="content">
    <h1 th:text="${jokeDto.id!=null ? 'Editar Joke' : 'Nuevo Joke'}"></h1>
    <form th:action="${jokeDto.id!=null
                      ? '/jokes/' + ${jokeDto.id}
                      : '/jokes'}"
          th:object="${jokeDto}" method="post">

        <!-- Para edición con PUT -->
        <input type="hidden" name="_method" value="put"
               th:if="${jokeDto.id != null}" />

        <div>
            <label for="text1">Text1:</label>
            <input id="text1" type="text" th:field="*{text1}" required />
        </div>

        <div>
            <label for="text2">Text2:</label>
            <textarea id="text2" th:field="*{text2}" required></textarea>
        </div>

        <div>
            <label for="category">Categoría:</label>
            <select id="category" th:field="*{category.id}">
                <option th:each="c : ${categories}"
                        th:value="${c.id}"
                        th:text="${c.name}">
                </option>
            </select>
        </div>

        <div>
            <label for="type">Tipo:</label>
            <select id="type" th:field="*{type.id}">
                <option th:each="t : ${types}"
                        th:value="${t.id}"
                        th:text="${t.type}">
                </option>
            </select>
        </div>

        <div>
            <label for="language">Idioma:</label>
            <select id="language" th:field="*{language.id}">
                <option th:each="l : ${langs}"
                        th:value="${l.id}"
                        th:text="${l.language}">
                </option>
            </select>
        </div>

        <div>
            <label for="flags">Flags:</label>
            <select id="flags" th:field="*{flags}" multiple>
                <option th:each="f : ${flags}"
                        th:value="${f.id}"
                        th:text="${f.name}">
                </option>
            </select>
        </div>

        <div>
            <button type="submit">Guardar</button>
            <a th:href="@{/jokes}">Cancelar</a>
        </div>
    </form>
</section>
</html>
