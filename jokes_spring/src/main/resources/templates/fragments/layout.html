<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content)">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${title}">App</title>

  <!-- Bootstrap CSS -->
  <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-ENjdO4Dr2bkBIFxQpeoA6A6BqU1KzIstzl+3oZHYgfA/tT4C1zjG1oW8yWLe+j3o"
          crossorigin="anonymous"/>
  <!-- Bootstrap Icons -->
  <link
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
          rel="stylesheet"/>
  <!-- Tu CSS -->
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>

<header>
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
      <a th:href="@{/jokes}" class="navbar-brand">Jokes</a>
      <a th:href="@{/flags}" class="navbar-brand">Flags</a>
    </div>
  </nav>
</header>

<!-- Con replace sustituyes este main por tu fragmento content -->
<main th:replace="${content}" class="container mt-4"></main>

<!-- Bootstrap JS Bundle -->
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-qEN9+U+g2GufaFnl+Kytt4E8bffZ9G+7udhOVi6WzxsTqPkdrq+5NgUDjRzzPDvv"
        crossorigin="anonymous"></script>
</body>
</html>
